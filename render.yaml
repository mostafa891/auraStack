services:
  - type: web
    name: aurastack-web
    env: python
    buildCommand: |
      pip install -r requirements.txt
      npm ci
      npm run build
      python manage.py collectstatic --noinput
      python manage.py migrate
    startCommand: gunicorn core.asgi:application -w 4 -k uvicorn.workers.UvicornWorker
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: NODE_VERSION
        value: 20.10.0
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: SITE_URL
        sync: false
